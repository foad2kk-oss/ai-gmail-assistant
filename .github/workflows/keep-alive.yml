name: Keep Supabase project active

# Supabase auto-pauses free-tier projects after 7 days without "real" API
# activity. A plain authenticated SELECT wasn't reliably counted, so this
# workflow does a real write (INSERT then DELETE) into the existing `logs`
# table daily so the project (ai-gmail-assistant) stays active.
#
# Setup required (one-time, in this repo's GitHub Settings > Secrets and
# variables > Actions):
#   SUPABASE_ANON_KEY  — the project's anon public key
#                         (Supabase Dashboard > Project Settings > API)
# Note: RLS is disabled on `logs` (see supabase/schema.sql), so the anon key
# can insert/delete here without any extra policy needs.

on:
  schedule:
    - cron: '17 6 * * *' # daily at 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret is set
        run: |
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is not set in this repository."
            echo "Go to: GitHub Settings > Secrets and variables > Actions > New repository secret"
            echo "Name: SUPABASE_ANON_KEY"
            echo "Value: your Supabase project anon key (from Supabase Dashboard > Project Settings > API)"
            exit 1
          fi
          echo "Secret is set."

      - name: Write + delete a heartbeat row in Supabase
        run: |
          BASE="https://sgsehpjgfgjwoquaupxi.supabase.co/rest/v1/logs"

          echo "Inserting heartbeat log row..."
          RESPONSE=$(curl -s --max-time 30 -X POST "$BASE" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"user_email":"system@keepalive","action":"keep_alive_ping","details":"Automated GitHub Actions ping to prevent Supabase auto-pause","status":"info"}')

          echo "Insert response: $RESPONSE"

          ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty' 2>/dev/null)

          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "WARNING: Insert did not return an id. Response was: $RESPONSE"
            echo "This may mean the Supabase project is paused or the key is invalid."
            echo "Exiting with success to avoid noisy failure emails — check the response above."
            exit 0
          fi

          echo "Inserted row id: $ID"

          echo "Deleting heartbeat row..."
          DEL_STATUS=$(curl -s --max-time 30 -X DELETE "$BASE?id=eq.$ID" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "%{http_code}")

          echo "Delete HTTP status: $DEL_STATUS"
          echo "Done. Supabase project pinged successfully."
