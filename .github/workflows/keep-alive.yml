name: Keep Supabase project active

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY secret is not set — skipping ping."
            echo "Add it in: Settings > Secrets and variables > Actions > New repository secret"
            exit 0
          fi

          BASE="https://sgsehpjgfgjwoquaupxi.supabase.co/rest/v1/logs"

          echo "Inserting heartbeat row..."
          RESPONSE=$(curl -s --max-time 30 -X POST "$BASE" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"user_email":"system@keepalive","action":"keep_alive_ping","details":"GitHub Actions keep-alive ping","status":"info"}')

          echo "Response: $RESPONSE"

          ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty' 2>/dev/null || true)

          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Could not get inserted row id — project may be paused or key invalid."
            exit 0
          fi

          echo "Inserted id: $ID — now deleting..."
          curl -s --max-time 30 -X DELETE "$BASE?id=eq.$ID" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "Delete status: %{http_code}\n"

          echo "Done."
